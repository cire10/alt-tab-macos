name: Build and Release AltTab

on:
  push:
    branches:
      - master
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build AltTab
        run: |
          xcodebuild -project alt-tab-macos.xcodeproj \
            -scheme Debug \
            -configuration Debug \
            -derivedDataPath ./DerivedData \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=YES \
            build

      - name: Package App Bundle
        run: |
          mkdir -p ./dist
          cd DerivedData/Build/Products/Debug
          zip -r -y ../../../../dist/AltTab.zip AltTab.app
          cd ../../../..
          ls -lh dist/AltTab.zip

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AltTab
          path: dist/AltTab.zip

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/')
        with:
          tag_name: latest
          name: "AltTab (Optimized Lightweight Build)"
          body: |
            ## Optimized AltTab Build

            - **Memory Optimization**: Proportionally downscales window thumbnails to tile dimensions upon capture (~50–70 MB RAM instead of ~1.6 GB).
            - **All Features Unlocked**: Native access to all appearance styles (App Icons, Titles, Auto Size), search in switcher, and extra shortcuts without paywalls.
            - **Streamlined Permissions**: Clean single-prompt flow without restart loops.

            ### Installation:
            1. Download `AltTab.zip` below.
            2. Unzip and drag `AltTab.app` into `/Applications`.
            3. Allow **Accessibility** (and **Screen Recording**) in **System Settings → Privacy & Security**.
          draft: false
          prerelease: false
          files: dist/AltTab.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
